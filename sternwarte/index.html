<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Die verschwundene Sternwarte · GCC00YN</title><meta name="description" content="Fünf Linsen, ein altes Beobachtungsbuch und ein verschlossenes Vermächtnis."><style>body{margin:0;padding:24px 12px;background:#080d17;color:#eee4cf;font-family:Georgia,serif}button,select,input{font:inherit}a{color:#d5b978}</style></head><body><div id="observatory-archive">
  <header><span class="eyebrow"><a href="https://coord.info/GCC00YN" target="_blank" rel="noopener" style="color:inherit">GCC00YN</a> · Das verschollene Beobachtungsbuch</span><h2>Die verschwundene Sternwarte</h2><p>Der letzte Astronom ist fort. Sein Fernrohr wartet noch.</p></header>
  <div class="sky"><canvas aria-label="Blick durch das Fernrohr auf einen erfundenen Sternenhimmel"></canvas><div class="bearing" aria-live="polite"></div></div>
  <div class="turn"><button type="button" class="cursor-interaction" data-turn="-1" aria-label="Fernrohr nach links drehen">← Drehen</button><span class="direction"></span><button type="button" class="cursor-interaction" data-turn="1" aria-label="Fernrohr nach rechts drehen">Drehen →</button></div>
  <div class="lenses" role="group" aria-label="Linse einsetzen"><button class="cursor-interaction" data-lens="0" type="button">Silberlinse</button><button class="cursor-interaction" data-lens="1" type="button">Prismenlinse</button><button class="cursor-interaction" data-lens="2" type="button">Bernsteinlinse</button><button class="cursor-interaction" data-lens="3" type="button">Rauchlinse</button><button class="cursor-interaction" data-lens="4" type="button">Kristalllinse</button></div>
  <p class="engraving" aria-live="polite"></p>
  <div class="turn"><button type="button" class="cursor-interaction" data-ring="-1">Ring −45°</button><span class="ring-label"></span><button type="button" class="cursor-interaction" data-ring="1">Ring +45°</button></div>
  <div class="journal"><span class="page-title"></span><p class="page-text"></p><div class="turn"><button type="button" class="cursor-interaction" data-page="-1">← Blatt</button><span class="page-number"></span><button type="button" class="cursor-interaction" data-page="1">Blatt →</button></div></div>
  <form><label>Fünf Siegel am verschlossenen Fach</label><div class="seals"></div><div class="answer"><button type="submit" class="cursor-interaction">Schloss prüfen</button></div></form>
  <p class="result" role="status"></p>
</div>
<style>
#observatory-archive{--night:#101622;--paper:#eee4cf;--brass:#d5b978;--dim:#b9beca;background:var(--night);color:var(--paper);padding:24px;border-radius:18px;font-family:Georgia,serif;box-sizing:border-box;max-width:740px;margin:auto}
#observatory-archive *{box-sizing:border-box}#observatory-archive header{padding-right:65px}#observatory-archive h2{font-size:26px;font-weight:400;margin:8px 0 12px}#observatory-archive p{line-height:1.6;margin:10px 0}#observatory-archive .eyebrow,#observatory-archive .journal>span{font:12px system-ui;color:var(--brass);letter-spacing:1.5px;text-transform:uppercase}#observatory-archive header p{color:var(--dim);font-size:15px}
#observatory-archive .sky{position:relative;height:300px;margin:20px 0 12px;background:#080d17;border-radius:12px;overflow:hidden}#observatory-archive canvas{display:block;width:100%;height:100%}#observatory-archive .bearing{position:absolute;bottom:13px;left:10px;right:10px;text-align:center;font:13px system-ui;color:var(--dim)}
#observatory-archive button{background:#212b3c;color:var(--paper);border:1px solid #465064;border-radius:8px;padding:12px 14px;font:14px system-ui;min-height:44px}#observatory-archive button[aria-pressed=true]{border-color:var(--brass);background:#463d2a;color:#fff2ce}#observatory-archive button:hover{background:#344159}#observatory-archive .turn{display:flex;align-items:center;justify-content:space-between;gap:10px}#observatory-archive .direction{font:14px system-ui;color:var(--brass)}#observatory-archive .lenses{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}#observatory-archive .lenses button{flex:1}#observatory-archive .engraving{font-size:14px;color:var(--brass);min-height:44px}#observatory-archive .journal{border-left:2px solid #76613c;padding:8px 0 8px 16px;margin:16px 0 22px}#observatory-archive .journal p{font-size:15px}#observatory-archive form label{display:block;font-size:15px;margin-bottom:12px}#observatory-archive .answer{display:flex;gap:10px;flex-wrap:wrap}#observatory-archive input{background:#080d17;color:var(--paper);border:1px solid #687184;border-radius:8px;width:100px;min-width:0;padding:10px;font:22px monospace;text-align:center;letter-spacing:5px}#observatory-archive .answer button{background:var(--brass);color:#1e1a12;border:0}#observatory-archive .result{color:var(--brass);font-size:16px}#observatory-archive :focus-visible{outline:3px solid #d5b978;outline-offset:3px}@media(max-width:440px){#observatory-archive{padding:16px}#observatory-archive h2{font-size:23px}#observatory-archive .sky{height:250px}#observatory-archive .lenses button{padding:10px 6px;font-size:12px}#observatory-archive header{padding-right:40px}}
#observatory-archive .seals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}#observatory-archive select{background:#212b3c;color:#eee4cf;border:1px solid #687184;border-radius:8px;font:24px Georgia;min-width:48px;min-height:48px;padding:4px;flex:1}#observatory-archive .ring-label,#observatory-archive .page-number{font:13px system-ui;color:#d5b978}#observatory-archive .page-text{min-height:100px}#observatory-archive .lenses button{flex:1 1 28%}</style>
<script>
(()=>{const root=document.getElementById('observatory-archive'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
const directions=['Norden','Nordosten','Osten','Südosten','Süden','Südwesten','Westen','Nordwesten'];const lensNames=['Silberlinse','Prismenlinse','Bernsteinlinse','Rauchlinse','Kristalllinse'];
const symbols=['☾','☆','☼','◇','♧','△','♒','♜'];
const discoveries=[{direction:7,ring:2,symbol:'♒'},{direction:2,ring:7,symbol:'♧'},{direction:5,ring:3,symbol:'◇'},{direction:0,ring:5,symbol:'☾'},{direction:3,ring:1,symbol:'☆'}];
const pages=[
['Einband innen','Das Fernrohr folgt dem Horizont. Der innere Ring trägt acht gleich weit entfernte Kerben; oben liegt seine Null. Die fünf Linsen offenbaren ihre Siegel nur bei der passenden Ausrichtung. Meine Randnotizen bewahren die Einstellungen.'],
['Die silberne Nacht','Mit Silber suchte ich genau zwischen Sonnenuntergang und Mitternacht. Vom Nullstrich führte ich den Ring eine Vierteldrehung im Uhrzeigersinn weiter.'],
['Ein gebrochener Morgen','Das Prisma blickte zum Sonnenaufgang. Sein Ring blieb eine einzige Kerbe vor der vollen Umdrehung stehen.'],
['Der Honig des Abends','Durch Bernstein sah ich zwischen Mittag und Sonnenuntergang. Am Ring zählte ich vom Nullstrich drei Kerben im Uhrzeigersinn.'],
['Ein kalter Schatten','Die Rauchlinse schaute der Mittagsrichtung genau entgegen. Den Ring stellte ich eine halbe Umdrehung und eine weitere Kerbe im Uhrzeigersinn von Null.'],
['Das letzte klare Licht','Kristall richtete ich genau zwischen Morgen und Mittag. Der Ring wich um eine Kerbe im Uhrzeigersinn von Null ab.'],
['Der verschlossene Nachlass','Die Siegel folgen weder der Reihenfolge meiner Blätter noch jener der Linsen: Kristall steht unmittelbar vor Silber. Bernstein folgt unmittelbar auf Rauch. Vor dem Prisma steht nichts. Silber beschliesst die Reihe.']];
let direction=0,lens=0,ring=0,page=0,seals=['','','','',''],complete=false;
const sealBox=root.querySelector('.seals');for(let i=0;i<5;i++){const select=document.createElement('select');select.setAttribute('aria-label','Siegel '+(i+1));select.innerHTML='<option value="">·</option>'+symbols.map(v=>'<option>'+v+'</option>').join('');select.addEventListener('change',()=>{seals[i]=select.value;complete=false;save();});sealBox.append(select);}
function restore(s){const v=s?.observatoryArchive;if(!v)return;direction=Number.isInteger(v.direction)?((v.direction%8)+8)%8:0;lens=Number.isInteger(v.lens)&&v.lens>=0&&v.lens<5?v.lens:0;ring=Number.isInteger(v.ring)?((v.ring%8)+8)%8:0;page=Number.isInteger(v.page)&&v.page>=0&&v.page<7?v.page:0;seals=Array.isArray(v.seals)&&v.seals.length===5?v.seals.map(x=>symbols.includes(x)?x:''):['','','','',''];complete=v.complete===true;}
function save(){}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.fillStyle='#080d17';ctx.fillRect(0,0,w,h);const cx=w/2,cy=h/2-8,r=Math.min(w*.43,h*.43);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,r);glow.addColorStop(0,['#1b2940','#292139','#342a20','#242633','#1c3033'][lens]);glow.addColorStop(1,'#080d17');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);let seed=137+direction*129;function rand(){seed=(seed*16807)%2147483647;return seed/2147483647;}for(let i=0;i<90;i++){const x=cx+(rand()*2-1)*r,y=cy+(rand()*2-1)*r;ctx.globalAlpha=.25+rand()*.7;ctx.fillStyle='#e7e7e5';ctx.beginPath();ctx.arc(x,y,.5+rand()*1.1,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;const d=discoveries[lens];if(direction===d.direction&&ring===d.ring){ctx.strokeStyle='#d5b978';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,58,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#f4d99c';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='46px Georgia';ctx.fillText(d.symbol,cx,cy);}else{ctx.strokeStyle='#a0aabd';ctx.globalAlpha=.45;ctx.beginPath();for(let i=0;i<5;i++){const x=cx+(rand()-.5)*r,y=cy+(rand()-.5)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();ctx.globalAlpha=1;}ctx.restore();ctx.save();ctx.translate(cx,cy);ctx.rotate(ring*Math.PI/4);for(let k=0;k<8;k++){ctx.rotate(Math.PI/4);ctx.strokeStyle=k===7?'#f4d99c':'#646b7b';ctx.lineWidth=k===7?3:1;ctx.beginPath();ctx.moveTo(0,-r+6);ctx.lineTo(0,-r+18);ctx.stroke();}ctx.restore();ctx.strokeStyle='#907b50';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#535b68';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-r-10,cy);ctx.lineTo(cx-r+15,cy);ctx.moveTo(cx+r-15,cy);ctx.lineTo(cx+r+10,cy);ctx.moveTo(cx,cy-r-10);ctx.lineTo(cx,cy-r+15);ctx.stroke();}
function render(){root.querySelector('.direction').textContent=directions[direction];root.querySelector('.bearing').textContent=lensNames[lens]+' · '+directions[direction];root.querySelectorAll('[data-lens]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.lens)===lens)));const d=discoveries[lens];root.querySelector('.engraving').textContent=direction===d.direction&&ring===d.ring?'Die Bruchstücke verbinden sich zu einem Siegel.':direction===d.direction?'Feine Linien treten hervor. Ihre Enden passen noch nicht zusammen.':'Einzelne Lichtspuren verlieren sich am Rand.';root.querySelector('.ring-label').textContent='Ring '+ring*45+'°';root.querySelector('.page-title').textContent=pages[page][0];root.querySelector('.page-text').textContent=pages[page][1];root.querySelector('.page-number').textContent=(page+1)+' / '+pages.length;root.querySelectorAll('select').forEach((el,i)=>el.value=seals[i]);root.querySelector('.result').textContent=complete?'Das Uhrwerk erwacht. Die Sternwarte öffnet sich. Final: N 47° 23.030′ E 008° 33.894′':'';draw();}
root.querySelectorAll('[data-turn]').forEach(b=>b.addEventListener('click',()=>{direction=(direction+Number(b.dataset.turn)+8)%8;render();save();}));root.querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{lens=Number(b.dataset.lens);render();save();}));root.querySelectorAll('[data-ring]').forEach(b=>b.addEventListener('click',()=>{ring=(ring+Number(b.dataset.ring)+8)%8;render();save();}));root.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=(page+Number(b.dataset.page)+pages.length)%pages.length;render();save();}));root.querySelector('form').addEventListener('submit',e=>{e.preventDefault();seals=Array.from(root.querySelectorAll('select'),el=>el.value);complete=seals.join('|')==='♧|☾|◇|☆|♒';render();if(!complete)root.querySelector('.result').textContent='Die Siegel greifen noch nicht ineinander.';save();});new ResizeObserver(draw).observe(canvas);render();})();
</script>
</body></html>
